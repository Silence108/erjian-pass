<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>二建学习站 · 界面方案</title>
  <link rel="stylesheet" href="versions.css">
</head>
<body>
  <main class="gallery-shell">
    <header class="gallery-head">
      <p class="eyebrow">二建学习站 / INTERFACE STUDY</p>
      <h1>选择一套学习界面</h1>
      <p class="gallery-lede">三套方案共享同一份章节、打卡与同步功能，只改变阅读节奏和工作台布局。</p>
    </header>

    <section class="proposal-grid" aria-label="三套界面方案">
      <article class="proposal">
        <div class="proposal-meta"><span class="proposal-no">01</span><span class="proposal-tag">高效工作台</span></div>
        <div class="mini-preview atlas-preview" aria-hidden="true">
          <div class="mini-header"><i></i><b>二建精讲讲义</b><span></span></div>
          <div class="mini-nav"><i></i><i></i><i></i><i></i></div>
          <div class="mini-content"><div class="mini-title"></div><div class="mini-stats"><i></i><i></i></div><div class="mini-lines"><i></i><i></i><i></i></div></div>
        </div>
        <h2>蓝图计划</h2>
        <p>蓝白底色、紧凑信息层级，适合每天打开查看进度和快速进入章节。</p>
        <a class="proposal-link" href="index.html?theme=atlas">打开完整方案 <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h11M11 5l5 5-5 5"/></svg></a>
      </article>

      <article class="proposal">
        <div class="proposal-meta"><span class="proposal-no">02</span><span class="proposal-tag">长文阅读</span></div>
        <div class="mini-preview paper-preview" aria-hidden="true">
          <div class="paper-rule"></div><div class="paper-title"></div><div class="paper-subtitle"></div>
          <div class="paper-cols"><i></i><i></i><i></i></div><div class="paper-rule lower"></div>
        </div>
        <h2>纸上工地</h2>
        <p>像一册整理过的讲义，弱化卡片和阴影，让章节、公式和重点成为主角。</p>
        <a class="proposal-link" href="index.html?theme=paper">打开完整方案 <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h11M11 5l5 5-5 5"/></svg></a>
      </article>

      <article class="proposal">
        <div class="proposal-meta"><span class="proposal-no">03</span><span class="proposal-tag">低干扰专注</span></div>
        <div class="mini-preview night-preview" aria-hidden="true">
          <div class="night-rail"><i></i><i></i><i></i><i></i></div>
          <div class="night-main"><div class="night-head"></div><div class="night-stat"></div><div class="night-row"></div><div class="night-row short"></div></div>
        </div>
        <h2>夜间专注</h2>
        <p>深色侧栏、弱对比边界和青绿色进度色，适合晚间连续学习和长时间阅读。</p>
        <a class="proposal-link" href="index.html?theme=night">打开完整方案 <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h11M11 5l5 5-5 5"/></svg></a>
      </article>
    </section>

    <footer class="gallery-foot"><a href="index.html">返回默认方案</a><span>·</span><span>内容与学习进度不会因方案切换改变</span></footer>
  </main>
</body>
</html>
